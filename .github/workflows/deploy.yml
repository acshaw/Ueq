name: Deploy

# Builds + publishes both apps, uploads to the private S3 deploy bucket, then triggers the
# on-instance deploy script via SSM Run Command (5.11 / CD6). No stored SSH key, no long-lived
# AWS secret in GitHub — auth is via OIDC (AWS_DEPLOY_ROLE_ARN) scoped to this repo only.
#
# Runs on push to main, or manually via workflow_dispatch (used for the first verification run
# per the devplan's build order — confirm this goes green before trusting push-to-main).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # required for aws-actions/configure-aws-credentials OIDC exchange
  contents: read

jobs:
  deploy:
    name: Build + deploy
    runs-on: ubuntu-latest
    env:
      # Belt-and-suspenders: configure-aws-credentials is supposed to export this for later
      # steps automatically, but a first real run showed it wasn't reaching the plain `aws`
      # CLI calls in this job (NoRegion error) — setting it explicitly removes the ambiguity.
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish API
        working-directory: api
        run: dotnet publish -c Release -r linux-x64 --self-contained false -o publish

      - name: Zip API artifact
        working-directory: api/publish
        run: zip -r ../../api.zip .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Build web (production is the default configuration)
        working-directory: web
        run: npm run build

      - name: Zip web artifact
        working-directory: web/dist/web/browser
        run: zip -r ../../../../web.zip .

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload artifacts to S3
        run: |
          aws s3 cp web.zip "s3://${{ vars.DEPLOY_BUCKET }}/web.zip"
          aws s3 cp api.zip "s3://${{ vars.DEPLOY_BUCKET }}/api.zip"

      - name: Trigger deploy on the instance via SSM
        run: |
          # The instance never gets AWS credentials (Lightsail's own baked-in metadata identity
          # would shadow any role we grant it — see deploy.sh's header comment). Instead, generate
          # short-lived presigned URLs here, where this job's OIDC-assumed role has real S3
          # permissions, and insert them as safely-quoted assignment lines right after deploy.sh's
          # shebang line (must stay line 1, or SSM's AWS-RunShellScript falls back to plain `sh`
          # instead of bash, and deploy.sh's `set -o pipefail` isn't valid there). Built entirely
          # via jq (--arg / @sh) rather than any text-substitution — two earlier attempts (sed,
          # then plain bash find/replace) both corrupted the `&` characters in the presigned URL's
          # query string; jq's @sh filter shell-quotes arbitrary content correctly with no such
          # risk, since it's not pattern-matching-based at all.
          #
          # GAMESERVER_URL (6.2): gameserver.tar.gz isn't built by this job (no Unity in CI — DH7)
          # — it's uploaded to the bucket manually/locally after a local Editor build (tar, not
          # zip — PowerShell's Compress-Archive writes backslash path separators Linux's unzip
          # can't parse). `aws s3 presign` doesn't check the object exists, so this still succeeds
          # even before the first manual upload; deploy.sh treats a resulting 404 as a skip, not a
          # failure.
          # CLIENT_URL/VERSION_URL (6.4): same story as GAMESERVER_URL — client.zip/version.txt
          # aren't built by this job either, uploaded manually/locally after a local Editor build.
          WEB_URL=$(aws s3 presign "s3://${{ vars.DEPLOY_BUCKET }}/web.zip" --expires-in 600)
          API_URL=$(aws s3 presign "s3://${{ vars.DEPLOY_BUCKET }}/api.zip" --expires-in 600)
          GAMESERVER_URL=$(aws s3 presign "s3://${{ vars.DEPLOY_BUCKET }}/gameserver.tar.gz" --expires-in 600)
          CLIENT_URL=$(aws s3 presign "s3://${{ vars.DEPLOY_BUCKET }}/client.zip" --expires-in 600)
          VERSION_URL=$(aws s3 presign "s3://${{ vars.DEPLOY_BUCKET }}/version.txt" --expires-in 600)
          COMMANDS_JSON=$(jq -n \
            --arg web "$WEB_URL" \
            --arg api "$API_URL" \
            --arg gameserver "$GAMESERVER_URL" \
            --arg client "$CLIENT_URL" \
            --arg version "$VERSION_URL" \
            --rawfile body deploy/deploy.sh \
            '($body | split("\n")) as $lines | [$lines[0], ("WEB_URL=" + ($web|@sh)), ("API_URL=" + ($api|@sh)), ("GAMESERVER_URL=" + ($gameserver|@sh)), ("CLIENT_URL=" + ($client|@sh)), ("VERSION_URL=" + ($version|@sh))] + $lines[1:]')
          PARAMS_JSON=$(jq -n --argjson commands "$COMMANDS_JSON" '{commands:$commands}')
          CMD_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=InstanceIds,Values=${{ vars.MANAGED_INSTANCE_ID }}" \
            --parameters "$PARAMS_JSON" \
            --query "Command.CommandId" --output text)
          echo "CMD_ID=$CMD_ID" >> "$GITHUB_ENV"
          echo "Sent command $CMD_ID to ${{ vars.MANAGED_INSTANCE_ID }}, waiting for completion..."
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "${{ vars.MANAGED_INSTANCE_ID }}"

      - name: Show remote deploy output
        if: always()
        run: |
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "${{ vars.MANAGED_INSTANCE_ID }}" \
            --query "{Status:Status,StdOut:StandardOutputContent,StdErr:StandardErrorContent}" \
            --output json
