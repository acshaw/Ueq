name: CI

# Build validation only — no AWS credentials, no deploy (5.11 / CD7). Runs on every push and PR
# so a broken build or a broken migration is caught before it's anywhere near the deploy workflow.

on:
  push:
  pull_request:

jobs:
  api-build:
    name: API build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore + build
        working-directory: api
        run: dotnet build --configuration Release

  web-build:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build (production configuration)
        working-directory: web
        run: npm run build

  migration-check:
    name: Migration order sanity check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ueq
          POSTGRES_PASSWORD: ueq
          POSTGRES_DB: ueq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ueq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply every migration in order against a fresh DB
        env:
          PGPASSWORD: ueq
        run: |
          for f in $(ls Assets/StreamingAssets/Database/Migrations/*.sql | sort); do
            echo "== Applying $f =="
            psql -h localhost -U ueq -d ueq -v ON_ERROR_STOP=1 -f "$f"
          done
